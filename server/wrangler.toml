name = "nhac-thuoc-scan"
main = "src/index.ts"
compatibility_date = "2026-09-01"

[vars]
DAILY_LIMIT = "20"
MODEL = "claude-haiku-5-5"

# Giới hạn lượt quét mỗi ngày cần một KV tên USAGE. Lệnh sau tự tạo và tự thêm vào cuối file này:
#   npx wrangler kv namespace create USAGE --binding USAGE --update-config

# Secret (không ghi vào file này):
#   npx wrangler secret put ANTHROPIC_API_KEY
#   npx wrangler secret put ACCESS_CODES     # ví dụ: Me=me-7Kq2,Tuan=tuan-p9Xz
